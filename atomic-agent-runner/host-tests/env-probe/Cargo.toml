[package]
name = "env-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fixture guest: reports the environment, args and filesystem it can see"
publish = false

# Its own workspace root: it sits under a workspace member's directory, where
# the parent's `exclude` alone does not stop cargo from claiming it.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.51"
