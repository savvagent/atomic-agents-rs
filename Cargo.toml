[workspace]
resolver = "2"
members = [
    "atomic-agents",
    "atomic-agents-macros",
    "atomic-assembler",
    "atomic-forge",
    "atomic-studio-runner",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/savvagent/atomic-agents-rs"
homepage = "https://github.com/savvagent/atomic-agents-rs"
keywords = ["ai", "agents", "llm", "pipeline", "structured-output"]
categories = ["science"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util"] }
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
indexmap = { version = "2", features = ["serde"] }
tiktoken-rs = "0.6"
pin-project-lite = "0.2"
