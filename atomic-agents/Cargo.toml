[package]
name = "atomic-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/atomic-agents"
description = "A lightweight, modular framework for building AI agent pipelines with structured LLM outputs"

[dependencies]
atomic-agents-macros = { version = "0.2.1", path = "../atomic-agents-macros" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio-stream.workspace = true
reqwest.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
indexmap.workspace = true
tiktoken-rs.workspace = true
pin-project-lite.workspace = true
bytes = "1"
eventsource-stream = "0.2"
# `~3.11`: redacting_http.rs implements rmcp's StreamableHttpClient for the
# same reqwest 0.13 as `reqwest_013`; a later rmcp may move reqwest versions.
rmcp = { version = "~3.11", optional = true, default-features = false, features = [
  "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls" ] }
shlex = { version = "1.3", optional = true }
url = { version = "2", optional = true }
http = { version = "1", optional = true }
# The reqwest that rmcp's Streamable HTTP client is built on, so it can be
# wrapped (see src/mcp/redacting_http.rs). Same features rmcp enables.
reqwest_013 = { package = "reqwest", version = "0.13", optional = true, default-features = false, features = [
  "json", "stream", "native-tls" ] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net", "time"] }
rmcp = { version = "~3.11", default-features = false, features = [
  "client", "server", "transport-child-process", "transport-io",
  "transport-streamable-http-client-reqwest", "reqwest-native-tls", "transport-streamable-http-server" ] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
wiremock = "0.6"
shlex = "1.3"
atomic-forge = { path = "../atomic-forge" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["openai"]
openai = []
anthropic = []
google = []
mcp = ["dep:rmcp", "dep:shlex", "dep:url", "dep:http", "dep:reqwest_013", "tokio/time"]

[[test]]
name = "mcp_integration"
path = "tests/mcp_integration.rs"
harness = false
required-features = ["mcp"]

[[example]]
name = "mcp_agent"
required-features = ["mcp", "openai"]
