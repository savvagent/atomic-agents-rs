[package]
name = "atomic-forge"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/atomic-forge"
description = "Collection of reusable tools for atomic-agents"

[dependencies]
atomic-agents = { version = "0.1.1", path = "../atomic-agents" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
evalexpr = "12"
scraper = "0.22"
url = { version = "2", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
lopdf = { version = "0.47.0", optional = true }
roxmltree = "0.21.2"
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"

[features]
default = []
# Date/time arithmetic and IANA timezone support for `datetime_tool`.
datetime = ["dep:chrono", "dep:chrono-tz"]
# PDF text extraction for `pdf_reader`.
pdf-reader = ["dep:lopdf"]
